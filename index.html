<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영암군 외식·식품 육성사업 공정 통합 대시보드</title>
    
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-orange: #dd6b20;
            --holiday-color: #e53e3e;
            --saturday-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #2d3748;
            
            --status-planned: #3182ce;
            --status-progress: #d69e2e;
            --status-done: #38a169;
            --status-hold: #718096;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 12px;
            user-select: none; -webkit-user-select: none;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            background: linear-gradient(135deg, var(--primary-color) 0%, #2c5282 100%); 
            color: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .header-title h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-title p { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }
        .client-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.25); }

        .project-selector { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .proj-btn { 
            flex: 1; min-width: 150px; background: rgba(255, 255, 255, 0.15); color: #edf2f7; 
            border: 1px solid rgba(255, 255, 255, 0.25); padding: 10px 12px; border-radius: 8px; 
            cursor: pointer; font-weight: 700; font-size: 0.82rem; text-align: center;
        }
        .proj-btn.active { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
        .stat-card { background: rgba(255, 255, 255, 0.12); padding: 8px 6px; border-radius: 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.15); }
        .stat-card .num { font-size: 1.15rem; font-weight: bold; color: #feebc8; }
        .stat-card .label { font-size: 0.7rem; opacity: 0.95; margin-top: 2px; white-space: nowrap; }

        .controls { 
            background: var(--card-bg); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; 
            border: 1px solid var(--border-color); 
        }
        .search-filter { display: flex; gap: 6px; flex: 1; min-width: 220px; align-items: center; }
        input[type="text"], input[type="datetime-local"], select, textarea { 
            padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; outline: none; font-family: inherit;
        }
        #searchInput { flex: 1; min-width: 120px; }

        .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; transition: 0.2s; }
        .btn-success { background: var(--status-done); color: white; }
        .btn-primary { background: var(--secondary-color); color: white; }
        .btn-danger { background: #e53e3e; color: white; }
        .btn-secondary { background: #4a5568; color: white; }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px 6px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--text-color); font-size: 0.8rem; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: var(--secondary-color); color: white; border-color: var(--secondary-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 업소 카드 */
        .company-cards-list { display: flex; flex-direction: column; gap: 10px; }
        .accordion-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }

        .card-summary { padding: 14px; background: #ffffff; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
        .summary-top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .summary-left { display: flex; align-items: flex-start; gap: 8px; }
        .company-num { font-size: 1.05rem; font-weight: 800; color: var(--secondary-color); width: 24px; flex-shrink: 0; }
        .company-name-box h3 { font-size: 1.0rem; font-weight: 700; color: var(--primary-color); }
        .company-info-text { font-size: 0.78rem; color: #718096; margin-top: 2px; }

        .summary-status-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; background: #f8fafc; padding: 8px 10px; border-radius: 6px; border: 1px solid #edf2f7; }
        .pills-box { display: flex; gap: 4px; flex-wrap: wrap; }
        .round-status-pill { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; background: white; border: 1px solid #cbd5e1; }
        .toggle-btn { background: #edf2f7; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; color: var(--primary-color); flex-shrink: 0; }

        .card-detail { display: none; padding: 14px; background: #f8fafc; border-top: 1px solid var(--border-color); }
        .card-detail.open { display: block; }

        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .form-row label { font-size: 0.75rem; font-weight: bold; color: #4a5568; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .req-box { background: #ebf8ff; padding: 10px; border-radius: 6px; border: 1px solid #bee3f8; margin-bottom: 10px; }
        .req-box label { font-weight: bold; color: #2b6cb0; font-size: 0.78rem; display: block; margin-bottom: 4px; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
        .task-item-box { background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .task-item-box h5 { font-size: 0.8rem; color: var(--primary-color); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }

        .map-link-inline { display: inline-flex; align-items: center; gap: 2px; color: #276749; text-decoration: none; font-weight: bold; font-size: 0.75rem; background: #c6f6d5; padding: 2px 6px; border-radius: 4px; margin-top: 4px; }

        /* 달력 & 공휴일 */
        .calendar-container { background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-header h2 { font-size: 1.1rem; color: var(--primary-color); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        
        .calendar-day-header { text-align: center; font-weight: bold; padding: 6px 2px; background: #f8fafc; border-radius: 4px; color: var(--primary-color); font-size: 0.78rem; }
        .calendar-day-header.sun { color: var(--holiday-color); }
        .calendar-day-header.sat { color: var(--saturday-color); }

        .calendar-day { height: 120px; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; background: #ffffff; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .calendar-day .date-num { font-weight: bold; font-size: 0.75rem; margin-bottom: 2px; position: sticky; top: 0; background: white; z-index: 1; display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; }
        .calendar-day.sun .date-num, .calendar-day.holiday .date-num { color: var(--holiday-color); }
        .calendar-day.sat .date-num { color: var(--saturday-color); }

        .event-card { background: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 0.68rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #cbd5e1; border-left-width: 3px; flex-shrink: 0; }
        .event-card.status-예정 { border-left-color: var(--status-planned); background: #ebf8ff; }
        .event-card.status-진행 { border-left-color: var(--status-progress); background: #fffaf0; }
        .event-card.status-완료 { border-left-color: var(--status-done); background: #f0fff4; }

        .mobile-schedule-list { display: none; flex-direction: column; gap: 10px; }
        .mobile-date-group { background: #ffffff; border-radius: 8px; border: 1px solid var(--border-color); padding: 12px; }
        .mobile-date-header { font-weight: 800; font-size: 0.9rem; color: var(--primary-color); padding-bottom: 6px; border-bottom: 1.5px solid #edf2f7; margin-bottom: 8px; display: flex; justify-content: space-between; }

        /* 공정표 */
        .gantt-container { background: var(--card-bg); border-radius: 10px; padding: 16px; border: 1px solid var(--border-color); overflow-x: auto; }
        .gantt-header { margin-bottom: 12px; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .gantt-table { width: 100%; min-width: 650px; border-collapse: collapse; font-size: 0.8rem; }
        .gantt-table th, .gantt-table td { border: 1px solid #edf2f7; padding: 8px 10px; text-align: center; }
        .gantt-table th { background: #f7fafc; color: var(--primary-color); font-weight: 700; }
        .gantt-table td.left { text-align: left; }
        .progress-bar-bg { background: #e2e8f0; border-radius: 10px; height: 14px; width: 100%; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; border-radius: 10px; background: var(--secondary-color); }
        .progress-text { position: absolute; top:0; left:0; width:100%; height:100%; font-size: 0.68rem; color: #1a202c; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* 모달 팝업 */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center; padding: 14px; }
        .modal-card { background: white; width: 100%; max-width: 480px; border-radius: 12px; padding: 18px; position: relative; max-height: 85vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 12px; right: 16px; font-size: 1.4rem; cursor: pointer; color: #a0aec0; }

        /* 상태 뱃지 */
        #syncBadge { display: none; font-size: 0.72rem; color: #2b6cb0; font-weight: bold; background: #e2e8f0; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .calendar-grid { display: none !important; }
            .mobile-schedule-list { display: flex !important; }
            .card-summary { flex-direction: column; }
            .header-title h1 { font-size: 1.1rem; }
            .stats-container { grid-template-columns: repeat(3, 1fr); }
            .stat-card .num { font-size: 1.0rem; }
            .stat-card .label { font-size: 0.65rem; }
        }
        @media (min-width: 769px) {
            .card-summary { flex-direction: row; align-items: center; justify-content: space-between; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <header>
        <div class="header-top">
            <div class="header-title">
                <h1>영암군 외식·식품 육성사업 공정 대시보드</h1>
                <p>수행기관 ↔ 영암군 담당 주무관 실시간 공정표 및 현장 스케줄 공유</p>
            </div>
            <div class="client-badge">🏛️ 영암군청 발주 사업</div>
        </div>

        <div class="project-selector">
            <button class="proj-btn active" id="btnProj1" onclick="switchProject(1)">
                📁 [과업 1] 영암 대표맛집 마케팅 (13개소)
            </button>
            <button class="proj-btn" id="btnProj2" onclick="switchProject(2)">
                📁 [과업 2] 농특산물 메뉴개발 및 홍보물 제작
            </button>
        </div>

        <div class="stats-container" id="statsBar"></div>
    </header>

    <div class="controls">
        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="업소명 / 대표자 / 메뉴..." onkeyup="filterData()">
            <select id="statusFilter" onchange="filterData()">
                <option value="">진행상태 전체</option>
                <option value="예정">예정</option>
                <option value="진행">진행중</option>
                <option value="완료">완료</option>
            </select>
            <span id="syncBadge">🔄 데이터 동기화 중...</span>
        </div>

        <!-- 관리자 전용 제어부 -->
        <div class="btn-action-group" id="adminControls" style="display: none;">
            <span style="font-size: 0.75rem; color: #2b6cb0; font-weight: bold;">🛠️ 관리자</span>
            <button class="btn btn-primary" onclick="addNewCompany()">➕ 업체 추가</button>
            <button class="btn btn-success" onclick="manualSync()">☁️ 시트 즉시동기화</button>
            <button class="btn btn-danger" onclick="logoutAdmin()">로그아웃</button>
        </div>

        <!-- 주무관 열람 모드 자물쇠 아이콘 -->
        <div id="guestControls">
            <button onclick="promptAdminLogin()" style="background: none; border: none; cursor: pointer; opacity: 0.2; font-size: 0.85rem;" title="관리자 인증">🔒</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cards-view', this)">📋 업소별 상세 & 요구사항</button>
        <button class="tab-btn" onclick="switchTab('calendar-view', this)">📅 현장방문 스케줄러</button>
        <button class="tab-btn" onclick="switchTab('gantt-view', this)">📊 전체 과업 공정표</button>
    </div>

    <!-- 탭 1: 상세 카드 뷰 -->
    <div id="cards-view" class="tab-content active">
        <div class="company-cards-list" id="cardsContainer"></div>
    </div>

    <!-- 탭 2: 달력 / 스케줄러 뷰 -->
    <div id="calendar-view" class="tab-content">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="changeMonth(-1)">◀ 이전달</button>
                <h2 id="calendarTitle">2026년 9월</h2>
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="changeMonth(1)">다음달 ▶</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header sun">일</div>
                <div class="calendar-day-header">월</div>
                <div class="calendar-day-header">화</div>
                <div class="calendar-day-header">수</div>
                <div class="calendar-day-header">목</div>
                <div class="calendar-day-header">금</div>
                <div class="calendar-day-header sat">토</div>
            </div>
            <div class="calendar-grid" id="calendarDays"></div>
            <div class="mobile-schedule-list" id="mobileScheduleList"></div>
        </div>
    </div>

    <!-- 탭 3: 공정표 (Gantt) -->
    <div id="gantt-view" class="tab-content">
        <div class="gantt-container" id="ganttContent"></div>
    </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="eventModal">
    <div class="modal-card">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    // 🔒 1. F12 개발자 도구 및 소스검사 단축키 차단
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        if (e.ctrlKey && ['U', 'u', 'S', 's'].includes(e.key)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    });

    // 🌐 2. 최신 구글 Apps Script Web App URL 연동
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwkmvmGVeIrn2-nBc0Y2DKN4HEi_xvVouXl9EQBENsCNK5G0C_9w_ADvYYz_ZNr34yXg/exec";
    const ADMIN_PASSWORD = "yeongam2026";

    let isAdmin = false;
    let currentProject = 1;
    let currentDate = new Date(2026, 8, 1); // 2026년 9월

    const koreanHolidays = {
        "2026-01-01": "신정", "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
        "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
        "2026-05-25": "대체공휴일", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
        "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-03": "개천절",
        "2026-10-09": "한글날", "2026-12-25": "성탄절"
    };

    let proj1Companies = [];
    let proj2Companies = [];
    let ganttData1 = [];
    let ganttData2 = [];

    // 구글 시트 데이터 로드 (캐시 무효화 타임스탬프 적용)
    async function loadDataFromSheet() {
        const badge = document.getElementById('syncBadge');
        if (badge) {
            badge.innerText = "🔄 구글 시트 불러오는 중...";
            badge.style.display = 'inline-block';
        }
        try {
            const cacheBuster = GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime();
            const res = await fetch(cacheBuster);
            const data = await res.json();

            if (data.proj1) proj1Companies = data.proj1;
            if (data.proj2) proj2Companies = data.proj2;
            if (data.gantt1) ganttData1 = data.gantt1;
            if (data.gantt2) ganttData2 = data.gantt2;
            
            renderStats();
            renderCards();
            renderCalendar();
            renderGantt();
        } catch (err) {
            console.warn("구글 시트 연동 실패:", err);
        } finally {
            if (badge) badge.style.display = 'none';
        }
    }

    // 구글 시트로 데이터 저장 (text/plain 전송으로 CORS 우회)
    async function syncToGoogleSheet() {
        const badge = document.getElementById('syncBadge');
        if (badge) {
            badge.innerText = "☁️ 시트에 저장 중...";
            badge.style.display = 'inline-block';
        }

        const payload = {
            proj1: proj1Companies,
            proj2: proj2Companies,
            gantt1: ganttData1,
            gantt2: ganttData2
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            });
        } catch (err) {
            console.error("구글 시트 전송 오류:", err);
        } finally {
            setTimeout(() => {
                if (badge) badge.style.display = 'none';
            }, 800);
        }
    }

    function manualSync() {
        syncToGoogleSheet();
        alert("구글 스프레드시트에 실시간 동기화 요청을 전송했습니다.");
    }

    // 관리자 모드 검증
    function checkAdminAuth() {
        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get('admin');
        const sessionAuth = sessionStorage.getItem('isAdminAuth') === 'true';

        if (adminKey === ADMIN_PASSWORD || sessionAuth) {
            enableAdminMode();
        } else {
            disableAdminMode();
        }
    }

    function enableAdminMode() {
        isAdmin = true;
        sessionStorage.setItem('isAdminAuth', 'true');
        document.getElementById('adminControls').style.display = 'flex';
        document.getElementById('guestControls').style.display = 'none';
        renderCards();
        renderGantt();
    }

    function disableAdminMode() {
        isAdmin = false;
        sessionStorage.removeItem('isAdminAuth');
        document.getElementById('adminControls').style.display = 'none';
        document.getElementById('guestControls').style.display = 'block';
        renderCards();
        renderGantt();
    }

    function promptAdminLogin() {
        const pwd = prompt("관리자 비밀번호를 입력하세요:");

    function toggleCard(idx) {
        const d = document.getElementById(`detail-${idx}`);
        const b = document.getElementById(`btn-${idx}`);
        if (d.classList.contains('open')) {
            d.classList.remove('open');
            b.innerText = '상세보기 ∨';
        } else {
            d.classList.add('open');
            b.innerText = '접기 ∧';
        }
    }

    function getColor(status) {
        if (!status) return '#718096';
        if (status.includes('완료') || status.includes('납품')) return '#38a169';
        if (status.includes('진행') || status.includes('선정') || status.includes('시안')) return '#d69e2e';
        return '#718096';
    }

            list.splice(idx, 1);
            renderStats();
            renderCards();
            renderCalendar();
            syncToGoogleSheet();
        }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const pcGrid = document.getElementById('calendarDays');
        const mList = document.getElementById('mobileScheduleList');
        pcGrid.innerHTML = '';
        mList.innerHTML = '';

        for (let i = 0; i < firstDay; i++) {
            pcGrid.appendChild(document.createElement('div'));
        }

        const list = (currentProject === 1) ? proj1Companies : proj2Companies;
        let hasEvents = false;

        for (let date = 1; date <= lastDate; date++) {
            const dayDiv = document.createElement('div');
            const dayOfWeek = new Date(year, month, date).getDay();
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
            const holidayTitle = koreanHolidays[dateStr] || '';

            let dayClasses = ['calendar-day'];
            if (dayOfWeek === 0) dayClasses.push('sun');
            if (dayOfWeek === 6) dayClasses.push('sat');
            if (holidayTitle) dayClasses.push('holiday');

            dayDiv.className = dayClasses.join(' ');
            dayDiv.innerHTML = `
                <div class="date-num">
                    <span>${date}</span>
                    ${holidayTitle ? `<span style="font-size:0.65rem; color:var(--holiday-color);">${holidayTitle}</span>` : ''}
                </div>
            `;

            const events = list.filter(c => c.consultDate && c.consultDate.startsWith(dateStr));

            events.forEach(ev => {
                const time = ev.consultDate.split('T')[1] || '';
                const card = document.createElement('div');
                card.className = `event-card status-${ev.consultStatus}`;
                card.innerHTML = `<strong>${time}</strong> ${ev.name}`;
                card.onclick = () => showEventModal(ev);
                dayDiv.appendChild(card);
            });

            pcGrid.appendChild(dayDiv);

            if (events.length > 0 || holidayTitle) {
                hasEvents = true;
                const mGroup = document.createElement('div');
                mGroup.className = 'mobile-date-group';
                let evHtml = '';
                events.forEach(ev => {
                    const time = ev.consultDate.split('T')[1] || '';
                    evHtml += `
                        <div class="event-card status-${ev.consultStatus}" onclick='showEventModal(${JSON.stringify(ev)})' style="padding:10px; margin-top:6px;">
                            <div style="font-weight:bold; color:var(--primary-color);">${time} ${ev.name} [${ev.consultStatus}]</div>
                            <div style="font-size:0.78rem; color:#4a5568; margin-top:2px;">담당: ${ev.consultant || '출장팀'} | ☎ ${ev.phone}</div>
                        </div>
                    `;
                });
                mGroup.innerHTML = `
                    <div class="mobile-date-header">
                        <span>${month + 1}월 ${date}일 (${['일','월','화','수','목','금','토'][dayOfWeek]})</span>
                        ${holidayTitle ? `<span style="font-size:0.75rem; color:var(--holiday-color); font-weight:bold;">${holidayTitle}</span>` : ''}
                    </div>
                    ${evHtml || '<div style="font-size:0.75rem; color:#a0aec0;">일정 없음</div>'}
                `;
                mList.appendChild(mGroup);
            }
        }

        if (!hasEvents) {
            mList.innerHTML = `<div style="padding:20px; text-align:center; color:#a0aec0; background:white; border-radius:8px; font-size:0.85rem;">이번 달 예정된 현장 방문 일정이 없습니다.</div>`;
        }
    }

    function changeMonth(d) {
        currentDate.setMonth(currentDate.getMonth() + d);
        renderCalendar();
    }

    function renderGantt() {
        const container = document.getElementById('ganttContent');
        const gList = (currentProject === 1) ? ganttData1 : ganttData2;

        let rowsHtml = '';
        gList.forEach((row, idx) => {
            if (isAdmin) {
                rowsHtml += `
                    <tr>
                        <td class="left"><input type="text" id="g-task-${idx}" value="${row.task}" style="width:100%;"></td>
                        <td><input type="text" id="g-spec-${idx}" value="${row.spec}" style="width:100%;"></td>
                        <td>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <input type="number" id="g-prog-${idx}" value="${row.progress}" min="0" max="100" style="width:65px;"> %
                                <div class="progress-bar-bg" style="flex:1;">
                                    <div class="progress-bar-fill" style="width:${row.progress}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <select id="g-stat-${idx}" style="width:100%;">
                                <option value="대기" ${row.status==='대기'?'selected':''}>대기</option>
                                <option value="진행" ${row.status==='진행'?'selected':''}>진행</option>
                                <option value="완료" ${row.status==='완료'?'selected':''}>완료</option>
                            </select>
                        </td>
                    </tr>
                `;
            } else {
                rowsHtml += `
                    <tr>
                        <td class="left">${row.task}</td>
                        <td>${row.spec}</td>
                        <td>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${row.progress}%;"></div>
                                <span class="progress-text">${row.progress}%</span>
                            </div>
                        </td>
                        <td><span style="font-weight:bold; color:${row.status==='완료'?'#38a169':'#3182ce'}">${row.status}</span></td>
                    </tr>
                `;
            }
        });

        container.innerHTML = `
            <div class="gantt-header">
                <h3>📊 [과업 ${currentProject}] 전체 과업 공정표</h3>
                ${isAdmin ? `<button class="btn btn-success" onclick="saveGantt()">💾 공정표 시트 동기화 저장</button>` : ''}
            </div>
            <table class="gantt-table">
                <thead>
                    <tr>
                        <th style="width:35%;">과업 내용</th>
                        <th style="width:20%;">수량 및 규격</th>
                        <th style="width:30%;">진척도 (%)</th>
                        <th style="width:15%;">진행 상태</th>
                    </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        `;
    }

    function saveGantt() {
        const gList = (currentProject === 1) ? ganttData1 : ganttData2;
        gList.forEach((row, idx) => {
            row.task = document.getElementById(`g-task-${idx}`).value;
            row.spec = document.getElementById(`g-spec-${idx}`).value;
            row.progress = Number(document.getElementById(`g-prog-${idx}`).value) || 0;
            row.status = document.getElementById(`g-stat-${idx}`).value;
        });
        renderGantt();
        syncToGoogleSheet();
        alert("공정표가 구글 시트에 안전하게 동기화되었습니다.");
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function showEventModal(ev) {
        document.getElementById('modalContent').innerHTML = `
            <h3 style="color:var(--primary-color); margin-bottom:8px;">${ev.name} 현장 일정</h3>
            <p style="font-size:0.85rem; margin-bottom:4px;"><strong>일시:</strong> ${ev.consultDate ? ev.consultDate.replace('T', ' ') : '미정'}</p>
            <p style="font-size:0.85rem; margin-bottom:4px;"><strong>대표자:</strong> ${ev.owner} (☎ ${ev.phone})</p>
            <p style="font-size:0.85rem; margin-bottom:8px;"><strong>주소:</strong> ${ev.address}</p>
            <div style="padding:10px; background:#f7fafc; border-radius:6px; font-size:0.82rem; border:1px solid #e2e8f0;">
                <strong>특이사항 / 요구사항:</strong><br>${ev.notes || '기재된 특이사항이 없습니다.'}
            </div>
        `;
        document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('eventModal').style.display = 'none';
    }

    function filterData() {
        const text = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        const cards = document.querySelectorAll('.accordion-card');
        const list = (currentProject === 1) ? proj1Companies : proj2Companies;

        list.forEach((c, idx) => {
            const matchText = (c.name || '').toLowerCase().includes(text) || (c.owner || '').toLowerCase().includes(text) || (c.mainDish || '').toLowerCase().includes(text);
            const matchStatus = !status || (c.consultStatus === status || (c.photoShoot && c.photoShoot === status));
            if (cards[idx]) {
                cards[idx].style.display = (matchText && matchStatus) ? '' : 'none';
            }
        });
    }

    window.onload = function() {
        checkAdminAuth();
        loadDataFromSheet();
    };
</script>
</body>
</html>
