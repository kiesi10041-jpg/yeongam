<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영암군 외식·식품 육성사업 공정 통합 대시보드</title>
    
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-orange: #dd6b20;
            --holiday-color: #e53e3e;
            --saturday-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #2d3748;
            --done-bg: #f1f5f9;
            --done-text: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 12px;
            user-select: none; -webkit-user-select: none;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { 
            background: linear-gradient(135deg, var(--primary-color) 0%, #2c5282 100%); 
            color: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .header-title h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-title p { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }
        .client-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.25); }

        /* 상단 과업 탭 영역 */
        .project-selector { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .proj-btn { 
            flex: 1; min-width: 140px; background: rgba(255, 255, 255, 0.15); color: #edf2f7; 
            border: 1px solid rgba(255, 255, 255, 0.25); padding: 10px 12px; border-radius: 8px; 
            cursor: pointer; font-weight: 700; font-size: 0.82rem; text-align: center; transition: 0.2s;
        }
        .proj-btn.active { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }
        .proj-btn.is-done { background: #475569; opacity: 0.85; border-color: #64748b; }
        .proj-btn.dimmed { opacity: 0.5; border-style: dashed; }
        .add-proj-btn { background: #38a169; border-color: #38a169; flex: 0.3; min-width: 110px; color: white; }
        .setting-proj-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
        .stat-card { background: rgba(255, 255, 255, 0.12); padding: 8px 6px; border-radius: 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.15); }
        .stat-card .num { font-size: 1.15rem; font-weight: bold; color: #feebc8; }
        .stat-card .label { font-size: 0.7rem; opacity: 0.95; margin-top: 2px; white-space: nowrap; }

        .controls { 
            background: var(--card-bg); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; 
            border: 1px solid var(--border-color); 
        }
        .search-filter { display: flex; gap: 6px; flex: 1; min-width: 220px; align-items: center; }
        input[type="text"], input[type="datetime-local"], select, textarea { 
            padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; outline: none; font-family: inherit;
        }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--secondary-color); margin-right: 4px; }
        #searchInput { flex: 1; min-width: 120px; }

        .btn-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap; transition: 0.2s; }
        .btn-success { background: #38a169; color: white; }
        .btn-primary { background: var(--secondary-color); color: white; }
        .btn-danger { background: #e53e3e; color: white; }
        .btn-secondary { background: #4a5568; color: white; }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px 6px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--text-color); font-size: 0.8rem; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: var(--secondary-color); color: white; border-color: var(--secondary-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .company-cards-list { display: flex; flex-direction: column; gap: 10px; }
        .accordion-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; transition: 0.2s; }
        
        /* 완료된 카드: 음영 처리 및 취소선 */
        .accordion-card.is-completed { background: var(--done-bg); opacity: 0.82; border-color: #cbd5e1; }
        .accordion-card.is-completed h3 { text-decoration: line-through; color: var(--done-text); }
        .badge-done { background: #475569; color: white; font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 6px; text-decoration: none !important; display: inline-block; }

        .card-summary { padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
        .summary-top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .summary-left { display: flex; align-items: flex-start; gap: 8px; }
        .company-chk { margin-top: 3px; accent-color: #e53e3e; width: 17px; height: 17px; }
        .company-num { font-size: 1.05rem; font-weight: 800; color: var(--secondary-color); width: 24px; flex-shrink: 0; }
        .company-name-box h3 { font-size: 1.0rem; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; }
        .company-info-text { font-size: 0.78rem; color: #718096; margin-top: 2px; line-height: 1.35; }

        .summary-status-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; background: #f8fafc; padding: 8px 10px; border-radius: 6px; border: 1px solid #edf2f7; }
        .pills-box { display: flex; gap: 4px; flex-wrap: wrap; }
        .round-status-pill { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; background: white; border: 1px solid #cbd5e1; }
        .toggle-btn { background: #edf2f7; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; color: var(--primary-color); flex-shrink: 0; }

        .card-detail { display: none; padding: 14px; background: #f8fafc; border-top: 1px solid var(--border-color); }
        .card-detail.open { display: block; }

        .admin-options { background: #fffbebf8; border: 1px dashed #d69e2e; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: flex; gap: 15px; font-size: 0.8rem; font-weight: bold; color: #975a16; }

        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .form-row label { font-size: 0.75rem; font-weight: bold; color: #4a5568; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .req-box { background: #ebf8ff; padding: 10px; border-radius: 6px; border: 1px solid #bee3f8; margin-bottom: 10px; }
        .req-box label { font-weight: bold; color: #2b6cb0; font-size: 0.78rem; display: block; margin-bottom: 4px; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 8px; }
        .task-item-box { background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .task-item-box h5 { font-size: 0.8rem; color: var(--primary-color); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }

        .map-link-inline { display: inline-flex; align-items: center; gap: 2px; color: #276749; text-decoration: none; font-weight: bold; font-size: 0.75rem; background: #c6f6d5; padding: 2px 6px; border-radius: 4px; margin-top: 4px; }

        /* 달력 */
        .calendar-container { background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-header h2 { font-size: 1.1rem; color: var(--primary-color); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-header { text-align: center; font-weight: bold; padding: 6px 2px; background: #f8fafc; border-radius: 4px; color: var(--primary-color); font-size: 0.78rem; }
        .calendar-day-header.sun { color: var(--holiday-color); }
        .calendar-day-header.sat { color: var(--saturday-color); }
        .calendar-day { height: 120px; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; background: #ffffff; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .calendar-day .date-num { font-weight: bold; font-size: 0.75rem; margin-bottom: 2px; display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; }
        .calendar-day.sun .date-num, .calendar-day.holiday .date-num { color: var(--holiday-color); }
        .calendar-day.sat .date-num { color: var(--saturday-color); }
        .event-card { background: #ffffff; padding: 4px 6px; border-radius: 4px; font-size: 0.68rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #cbd5e1; border-left-width: 3px; }
        .event-card.status-예정 { border-left-color: var(--status-planned); background: #ebf8ff; }
        .event-card.status-진행 { border-left-color: var(--status-progress); background: #fffaf0; }
        .event-card.status-완료 { border-left-color: var(--status-done); background: #f0fff4; text-decoration: line-through; color: #64748b; }

        .mobile-schedule-list { display: none; flex-direction: column; gap: 10px; }
        .mobile-date-group { background: #ffffff; border-radius: 8px; border: 1px solid var(--border-color); padding: 12px; }
        .mobile-date-header { font-weight: 800; font-size: 0.9rem; color: var(--primary-color); padding-bottom: 6px; border-bottom: 1.5px solid #edf2f7; margin-bottom: 8px; display: flex; justify-content: space-between; }

        #syncBadge { display: none; font-size: 0.72rem; color: #2b6cb0; font-weight: bold; background: #e2e8f0; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .calendar-grid { display: none !important; }
            .mobile-schedule-list { display: flex !important; }
            .card-summary { flex-direction: column; }
            .header-title h1 { font-size: 1.1rem; }
            .stats-container { grid-template-columns: repeat(3, 1fr); }
            .stat-card .num { font-size: 1.0rem; }
            .stat-card .label { font-size: 0.65rem; }
        }
        @media (min-width: 769px) {
            .card-summary { flex-direction: row; align-items: center; justify-content: space-between; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <header>
        <div class="header-top">
            <div class="header-title">
                <h1>영암군 외식·식품 육성사업 공정 대시보드</h1>
                <p>수행기관 ↔ 영암군 담당 주무관 실시간 공정표 및 현장 스케줄 공유</p>
            </div>
            <div class="client-badge">🏛️ 영암군청 발주 사업</div>
        </div>

        <!-- 과업 탭 영역 (상시 보장) -->
        <div id="projectTabs" class="project-selector"></div>
        <div class="stats-container" id="statsBar"></div>
    </header>

    <div class="controls">
        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="업소명 / 연락처 / 내용 검색..." onkeyup="filterData()">
            <select id="statusFilter" onchange="filterData()">
                <option value="">진행상태 전체</option>
                <option value="예정">예정</option>
                <option value="진행">진행중</option>
                <option value="완료">완료</option>
            </select>
            <span id="syncBadge">🔄 데이터 동기화 중...</span>
        </div>

        <div class="btn-action-group" id="adminControls" style="display: none;">
            <label style="font-size: 0.78rem; font-weight: bold; color: #4a5568; display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="selectAllChk" onchange="toggleSelectAll(this.checked)"> 전체선택
            </label>
            <button class="btn btn-danger" id="btnBatchDelete" onclick="deleteSelectedCompanies()" style="display: none;">🗑️ 선택 삭제</button>
            <button class="btn btn-primary" onclick="addNewCompany()">➕ 업체 즉시 추가</button>
            <button class="btn btn-success" onclick="manualSync()">☁️ 즉시 동기화</button>
            <button class="btn btn-secondary" onclick="logoutAdmin()">로그아웃</button>
        </div>

        <div id="guestControls">
            <button onclick="promptAdminLogin()" style="background: none; border: none; cursor: pointer; opacity: 0.2; font-size: 0.85rem;" title="관리자 인증">🔒</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cards-view', this)">📋 업소별 상세 & 요구사항</button>
        <button class="tab-btn" onclick="switchTab('calendar-view', this)">📅 현장방문 스케줄러</button>
    </div>

    <div id="cards-view" class="tab-content active">
        <div class="company-cards-list" id="cardsContainer"></div>
    </div>

    <div id="calendar-view" class="tab-content">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="changeMonth(-1)">◀ 이전달</button>
                <h2 id="calendarTitle">2026년 9월</h2>
                <button class="btn btn-secondary" style="padding:5px 10px;" onclick="changeMonth(1)">다음달 ▶</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header sun">일</div>
                <div class="calendar-day-header">월</div>
                <div class="calendar-day-header">화</div>
                <div class="calendar-day-header">수</div>
                <div class="calendar-day-header">목</div>
                <div class="calendar-day-header">금</div>
                <div class="calendar-day-header sat">토</div>
            </div>
            <div class="calendar-grid" id="calendarDays"></div>
            <div class="mobile-schedule-list" id="mobileScheduleList"></div>
        </div>
    </div>
</div>

<script>
    // 🔒 F12 및 우클릭 보안 차단
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || 
            (e.ctrlKey && ['U','S'].includes(e.key.toUpperCase()))) {
            e.preventDefault(); e.stopPropagation(); return false;
        }
    });

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_o2ekT0chZ4ZP5rLlYk_C32rG3AKmi1n-6w8LUTRo4B5EbdLjRFsjcn-2NOnQmmnDTg/exec";
    const ADMIN_PASSWORD = "yeongam2026";

    let isAdmin = false;

    // ★ 화면 깨짐 방지: 상시 기본 과업 탭 100% 보장
    let projects = [
        { id: 1, name: "대표맛집", isVisible: true, isDone: false },
        { id: 2, name: "농특산물", isVisible: true, isDone: false }
    ];
    let companies = [];
    let currentProject = 1;
    let currentDate = new Date(2026, 8, 1);

    const koreanHolidays = {
        "2026-01-01": "신정", "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
        "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
        "2026-05-25": "대체공휴일", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
        "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-03": "개천절",
        "2026-10-09": "한글날", "2026-12-25": "성탄절"
    };

    // [GET: 시트 데이터 동기화]
    async function loadDataFromSheet() {
        showBadge("🔄 구글 시트 불러오는 중...");
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await res.json();

            if (data.projects && data.projects.length > 0) {
                projects = data.projects;
            }
            if (data.companies) {
                companies = data.companies;
            }

            if (!projects.find(p => p.id === currentProject)) {
                currentProject = projects[0].id;
            }
        } catch (err) {
            console.warn("시트 로드 딜레이 (기본값 유지):", err);
        } finally {
            hideBadge();
            renderProjectTabs();
            renderStats();
            renderCards();
            renderCalendar();
        }
    }

    // [POST: 시트로 실시간 저장]
    async function syncToGoogleSheet() {
        showBadge("☁️ 시트에 저장 중...");
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ projects, companies })
            });
        } catch (err) {
            console.error("저장 오류:", err);
        } finally {
            setTimeout(hideBadge, 800);
        }
    }

    function showBadge(msg) {
        const b = document.getElementById('syncBadge');
        if (b) { b.innerText = msg; b.style.display = 'inline-block'; }
    }
    function hideBadge() {
        const b = document.getElementById('syncBadge');
        if (b) b.style.display = 'none';
    }

    function manualSync() {
        syncToGoogleSheet();
        alert("구글 스프레드시트에 즉시 동기화되었습니다.");
    }

    function checkAdminAuth() {
        const adminKey = new URLSearchParams(window.location.search).get('admin');
        if (adminKey === ADMIN_PASSWORD || sessionStorage.getItem('isAdminAuth') === 'true') {
            isAdmin = true;
            sessionStorage.setItem('isAdminAuth', 'true');
            document.getElementById('adminControls').style.display = 'flex';
            document.getElementById('guestControls').style.display = 'none';
        }
    }

    function promptAdminLogin() {
        if (prompt("관리자 비밀번호를 입력하세요:") === ADMIN_PASSWORD) {
            isAdmin = true;
            sessionStorage.setItem('isAdminAuth', 'true');
            window.location.reload();
        } else {
            alert("비밀번호가 올바르지 않습니다.");
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('isAdminAuth');
        window.location.href = window.location.pathname;
    }

    // 상단 과업 탭 렌더링
    function renderProjectTabs() {
        const container = document.getElementById('projectTabs');
        if (!container) return;
        container.innerHTML = '';

        projects.forEach(p => {
            if (!isAdmin && !p.isVisible) return; // 주무관 모드에서는 숨겨진 과업 제외

            const btn = document.createElement('button');
            btn.className = `proj-btn ${currentProject === p.id ? 'active' : ''} ${p.isDone ? 'is-done' : ''} ${!p.isVisible ? 'dimmed' : ''}`;
            btn.innerHTML = `📁 ${p.name} ${p.isDone ? ' [완료]' : ''} ${isAdmin && !p.isVisible ? ' 🙈(숨김)' : ''}`;
            btn.onclick = () => {
                currentProject = p.id;
                renderProjectTabs();
                renderStats();
                renderCards();
                renderCalendar();
            };
            container.appendChild(btn);
        });

        if (isAdmin) {
            const setBtn = document.createElement('button');
            setBtn.className = 'setting-proj-btn';
            setBtn.innerHTML = '⚙️ 과업 관리';
            setBtn.onclick = manageCurrentProject;
            container.appendChild(setBtn);

            const addBtn = document.createElement('button');
            addBtn.className = 'proj-btn add-proj-btn';
            addBtn.innerText = '➕ 과업 추가';
            addBtn.onclick = addNewProject;
            container.appendChild(addBtn);
        }
    }

    // 과업 추가 (구글 시트에 탭 자동 생성)
    function addNewProject() {
        const name = prompt("새로운 과업 이름을 입력하세요:\n(입력 즉시 상단 탭 및 구글 시트에 동일한 이름의 탭이 생성됩니다)");
        if (name && name.trim()) {
            const newId = Date.now();
            projects.push({ id: newId, name: name.trim(), isVisible: true, isDone: false });
            currentProject = newId;
            renderProjectTabs();
            renderStats();
            renderCards();
            renderCalendar();
            syncToGoogleSheet();
        }
    }

    // 과업 완료, 숨김/노출, 삭제 제어
    function manageCurrentProject() {
        const p = projects.find(x => x.id === currentProject);
        if (!p) return;
        const msg = `[${p.name}] 과업 설정 관리\n\n` +
                    `1. 과업 이름 변경\n` +
                    `2. ${p.isVisible ? '주무관 화면에서 숨기기' : '주무관 화면에 노출하기'}\n` +
                    `3. ${p.isDone ? '과업 진행중으로 변경' : '과업 완료 처리 (완료 뱃지 및 회색 표시)'}\n` +
                    `4. 과업 삭제 (포함된 업체 데이터 일괄 정리)\n\n` +
                    `원하는 작업 번호를 입력하세요:`;
        
        const act = prompt(msg);
        if (act === '1') {
            const nn = prompt("새 과업 이름을 입력하세요:", p.name);
            if (nn && nn.trim()) { p.name = nn.trim(); renderProjectTabs(); syncToGoogleSheet(); }
        } else if (act === '2') {
            p.isVisible = !p.isVisible;
            alert(p.isVisible ? "주무관 화면에 노출됩니다." : "주무관 화면에서 숨김 처리되었습니다.");
            renderProjectTabs(); syncToGoogleSheet();
        } else if (act === '3') {
            p.isDone = !p.isDone;
            alert(p.isDone ? "과업이 완료 처리되었습니다." : "과업이 진행중 상태로 변경되었습니다.");
            renderProjectTabs(); syncToGoogleSheet();
        } else if (act === '4') {
            if (projects.length <= 1) {
                alert("최소 1개의 과업은 유지되어야 합니다.");
                return;
            }
            if (confirm(`정말 [${p.name}] 과업을 삭제하시겠습니까?\n구글 시트에서도 해당 탭의 내용이 삭제됩니다.`)) {
                projects = projects.filter(x => x.id !== currentProject);
                companies = companies.filter(x => x.projectId !== currentProject);
                currentProject = projects[0].id;
                renderProjectTabs(); renderStats(); renderCards(); renderCalendar(); syncToGoogleSheet();
            }
        }
    }

    function renderStats() {
        const bar = document.getElementById('statsBar');
        const list = companies.filter(c => c.projectId === currentProject);
        const total = list.length;
        const photoDone = list.filter(c => (c.photoShoot || '').includes("완료")).length;
        const placeDone = list.filter(c => (c.smartPlace || '').includes("완료")).length;
        const posterDone = list.filter(c => (c.posterStatus || '').includes("완료") || (c.posterStatus || '').includes("납품")).length;
        const consultDone = list.filter(c => (c.consultStatus || '').includes("완료")).length;

        bar.innerHTML = `
            <div class="stat-card"><div class="num">${total}개소</div><div class="label">전체 대상업체</div></div>
            <div class="stat-card"><div class="num">${photoDone}/${total}</div><div class="label">사진/개발</div></div>
            <div class="stat-card"><div class="num">${placeDone}/${total}</div><div class="label">스마트플레이스</div></div>
            <div class="stat-card"><div class="num">${posterDone}/${total}</div><div class="label">홍보물제작</div></div>
            <div class="stat-card"><div class="num">${consultDone}/${total}</div><div class="label">컨설팅완료</div></div>
        `;
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        
        let list = companies.filter(c => c.projectId === currentProject);
        if (!isAdmin) list = list.filter(c => c.isVisible !== false);

        // 완료된 업체는 자동으로 하단 정렬
        list.sort((a, b) => (a.isCompleted === b.isCompleted) ? 0 : a.isCompleted ? 1 : -1);

        if (list.length === 0) {
            container.innerHTML = `<div style="padding:30px; text-align:center; color:#a0aec0; background:white; border-radius:10px; border:1px solid #e2e8f0;">등록된 업체 정보가 없습니다. (관리자 모드에서 [➕ 업체 즉시 추가]를 눌러주세요)</div>`;
            return;
        }

        list.forEach((c, idx) => {
            const card = document.createElement('div');
            card.className = `accordion-card ${c.isCompleted ? 'is-completed' : ''}`;
            const mapUrl = `https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(c.address || '')}`;
            const phoneInfo = [c.phone ? `📱 ${c.phone}` : '', c.storePhone ? `☎️ 매장: ${c.storePhone}` : ''].filter(Boolean).join(' | ');

            card.innerHTML = `
                <div class="card-summary" onclick="toggleCard(${c.id})">
                    <div class="summary-top-row">
                        <div class="summary-left">
                            ${isAdmin ? `<input type="checkbox" class="company-chk" data-id="${c.id}" onclick="event.stopPropagation(); updateSelectedCount();">` : ''}
                            <span class="company-num">${idx + 1}</span>
                            <div class="company-name-box">
                                <h3>${c.name || '(업체명 미입력)'} 
                                    <span style="font-size:0.75rem; font-weight:normal; color:#dd6b20; margin-left:6px;">[${c.mainDish || '품목/메뉴'}]</span>
                                    ${c.isCompleted ? `<span class="badge-done">과업완료</span>` : ''}
                                    ${isAdmin && !c.isVisible ? `<span title="주무관 화면 숨김" style="font-size:0.8rem; margin-left:4px;">🙈</span>` : ''}
                                </h3>
                                <div class="company-info-text">${c.owner ? `대표: ${c.owner} | ` : ''}${phoneInfo}<br>${c.address || '주소 미등록'}</div>
                            </div>
                        </div>
                    </div>
                    <div class="summary-status-row">
                        <div class="pills-box">
                            <span class="round-status-pill">촬영: ${c.photoShoot || '대기'}</span>
                            <span class="round-status-pill">플레이스: ${c.smartPlace || '대기'}</span>
                            <span class="round-status-pill">홍보물: ${c.posterStatus || '대기'}</span>
                            <span class="round-status-pill">컨설팅: ${c.consultStatus || '예정'}</span>
                        </div>
                        <button class="toggle-btn" id="btn-${c.id}">상세보기 ∨</button>
                    </div>
                </div>
                <div class="card-detail ${c.isEditing ? 'open' : ''}" id="detail-${c.id}">
                    ${isAdmin ? `
                        <div class="admin-options">
                            <label><input type="checkbox" id="f-comp-${c.id}" ${c.isCompleted ? 'checked' : ''}> ✅ 과업 완전 종료 (음영 처리 및 하단 정렬)</label>
                            <label><input type="checkbox" id="f-vis-${c.id}" ${c.isVisible !== false ? 'checked' : ''}> 👁️ 주무관에게 노출</label>
                        </div>
                        <div class="form-grid-2">
                            <div class="form-row"><label>업체명</label><input type="text" id="f-name-${c.id}" value="${c.name || ''}" placeholder="예: 중원회관"></div>
                            <div class="form-row"><label>메뉴/주력품목</label><input type="text" id="f-dish-${c.id}" value="${c.mainDish || ''}" placeholder="예: 갈낙탕, 무화과"></div>
                        </div>
                        <div class="form-grid-2">
                            <div class="form-row"><label>대표자 성명</label><input type="text" id="f-owner-${c.id}" value="${c.owner || ''}"></div>
                            <div class="form-row"><label>대표자 휴대폰</label><input type="text" id="f-phone-${c.id}" value="${c.phone || ''}" placeholder="010-0000-0000"></div>
                        </div>
                        <div class="form-grid-2">
                            <div class="form-row"><label>영업장 번호 (매장 전화)</label><input type="text" id="f-sphone-${c.id}" value="${c.storePhone || ''}" placeholder="061-000-0000"></div>
                            <div class="form-row"><label>사업장 주소</label><input type="text" id="f-addr-${c.id}" value="${c.address || ''}"></div>
                        </div>
                        <div class="req-box">
                            <label>📌 현장 요구사항 및 주무관 메모</label>
                            <textarea id="f-notes-${c.id}" rows="2" style="width:100%;">${c.notes || ''}</textarea>
                        </div>
                        <div class="tasks-grid">
                            <div class="task-item-box"><h5>사진/개발</h5><input type="text" id="f-photo-${c.id}" value="${c.photoShoot || ''}"></div>
                            <div class="task-item-box"><h5>스마트플레이스</h5><input type="text" id="f-place-${c.id}" value="${c.smartPlace || ''}"></div>
                            <div class="task-item-box"><h5>포스터/홍보물</h5><input type="text" id="f-poster-${c.id}" value="${c.posterStatus || ''}"></div>
                            <div class="task-item-box"><h5>컨설팅상태</h5><input type="text" id="f-cstat-${c.id}" value="${c.consultStatus || ''}"></div>
                        </div>
                        <div class="form-grid-2" style="margin-top:8px;">
                            <div class="form-row"><label>방문 일시</label><input type="datetime-local" id="f-cdate-${c.id}" value="${c.consultDate || ''}"></div>
                            <div class="form-row"><label>담당자</label><input type="text" id="f-cmgr-${c.id}" value="${c.consultant || ''}"></div>
                        </div>
                        <div style="display:flex; gap:6px; margin-top:10px;">
                            <button class="btn btn-success" style="flex:1;" onclick="saveCompany(${c.id})">💾 변경사항 저장</button>
                            <button class="btn btn-danger" onclick="deleteSingle(${c.id})">🗑️ 삭제</button>
                        </div>
                    ` : `
                        <div class="req-box">
                            <strong>📌 현장 요구사항 & 공유 메모:</strong><br>${c.notes || '기재된 특이사항 없음'}
                            <div><a href="${mapUrl}" target="_blank" class="map-link-inline">📍 네이버 지도 길찾기</a></div>
                        </div>
                        <div class="tasks-grid">
                            <div class="task-item-box"><h5>사진/개발</h5><p style="font-size:0.75rem;">${c.photoShoot || '대기'}</p></div>
                            <div class="task-item-box"><h5>스마트플레이스</h5><p style="font-size:0.75rem;">${c.smartPlace || '대기'}</p></div>
                            <div class="task-item-box"><h5>포스터/홍보물</h5><p style="font-size:0.75rem;">${c.posterStatus || '대기'}</p></div>
                            <div class="task-item-box"><h5>컨설팅상태</h5><p style="font-size:0.75rem;">${c.consultStatus || '예정'} (${c.consultDate ? c.consultDate.replace('T', ' ') : '일정 조율'})</p></div>
                        </div>
                    `}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggleCard(id) {
        const d = document.getElementById(`detail-${id}`);
        const b = document.getElementById(`btn-${id}`);
        if (d.classList.contains('open')) {
            d.classList.remove('open'); b.innerText = '상세보기 ∨';
        } else {
            d.classList.add('open'); b.innerText = '접기 ∧';
        }
    }

    // 팝업 없이 즉시 하단에 입력 카드 생성
    function addNewCompany() {
        const newId = Date.now();
        companies.push({
            id: newId, projectId: currentProject, name: "", owner: "", phone: "", storePhone: "",
            address: "전남 영암군", mainDish: "", photoShoot: "대기", smartPlace: "대기", posterStatus: "대기",
            consultStatus: "예정", consultDate: "", consultant: "심훈 팀장", notes: "",
            isCompleted: false, isVisible: true, isEditing: true
        });
        renderCards();
        setTimeout(() => {
            const input = document.getElementById(`f-name-${newId}`);
            if (input) {
                input.focus();
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 100);
    }

    function saveCompany(id) {
        const c = companies.find(x => x.id === id);
        if (!c) return;

        c.isCompleted = document.getElementById(`f-comp-${id}`).checked;
        c.isVisible = document.getElementById(`f-vis-${id}`).checked;
        c.name = document.getElementById(`f-name-${id}`).value.trim();
        c.mainDish = document.getElementById(`f-dish-${id}`).value.trim();
        c.owner = document.getElementById(`f-owner-${id}`).value.trim();
        c.phone = document.getElementById(`f-phone-${id}`).value.trim();
        c.storePhone = document.getElementById(`f-sphone-${id}`).value.trim();
        c.address = document.getElementById(`f-addr-${id}`).value.trim();
        c.notes = document.getElementById(`f-notes-${id}`).value.trim();
        c.photoShoot = document.getElementById(`f-photo-${id}`).value.trim();
        c.smartPlace = document.getElementById(`f-place-${id}`).value.trim();
        c.posterStatus = document.getElementById(`f-poster-${id}`).value.trim();
        c.consultStatus = document.getElementById(`f-cstat-${id}`).value.trim();
        c.consultDate = document.getElementById(`f-cdate-${id}`).value;
        c.consultant = document.getElementById(`f-cmgr-${id}`).value.trim();
        c.isEditing = false;

        renderStats();
        renderCards();
        renderCalendar();
        syncToGoogleSheet();
        alert("업체 정보가 구글 시트에 즉시 반영되었습니다.");
    }

    function deleteSingle(id) {
        const c = companies.find(x => x.id === id);
        if (confirm(`[${c.name || '해당 업체'}]를 삭제하시겠습니까? 구글 시트에서도 즉시 삭제됩니다.`)) {
            companies = companies.filter(x => x.id !== id);
            renderStats(); renderCards(); renderCalendar(); syncToGoogleSheet();
        }
    }

    function toggleSelectAll(checked) {
        document.querySelectorAll('.company-chk').forEach(c => c.checked = checked);
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const cnt = document.querySelectorAll('.company-chk:checked').length;
        const btn = document.getElementById('btnBatchDelete');
        if (btn) {
            if (cnt > 0) {
                btn.style.display = 'inline-block';
                btn.innerText = `🗑️ 선택 삭제 (${cnt}개)`;
            } else {
                btn.style.display = 'none';
            }
        }
    }

    function deleteSelectedCompanies() {
        const chks = document.querySelectorAll('.company-chk:checked');
        if (chks.length === 0) return;
        if (!confirm(`선택한 ${chks.length}개 업체를 일괄 삭제하시겠습니까?`)) return;

        const idsToDelete = Array.from(chks).map(c => parseInt(c.getAttribute('data-id')));
        companies = companies.filter(x => !idsToDelete.includes(x.id));

        document.getElementById('selectAllChk').checked = false;
        updateSelectedCount();
        renderStats();
        renderCards();
        renderCalendar();
        syncToGoogleSheet();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const pcGrid = document.getElementById('calendarDays');
        const mList = document.getElementById('mobileScheduleList');
        if (!pcGrid || !mList) return;
        pcGrid.innerHTML = '';
        mList.innerHTML = '';

        for (let i = 0; i < firstDay; i++) {
            pcGrid.appendChild(document.createElement('div'));
        }

        let list = companies.filter(c => c.projectId === currentProject);
        if (!isAdmin) list = list.filter(c => c.isVisible !== false);
        let hasEvents = false;

        for (let date = 1; date <= lastDate; date++) {
            const dayDiv = document.createElement('div');
            const dayOfWeek = new Date(year, month, date).getDay();
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
            const holidayTitle = koreanHolidays[dateStr] || '';

            let dayClasses = ['calendar-day'];
            if (dayOfWeek === 0) dayClasses.push('sun');
            if (dayOfWeek === 6) dayClasses.push('sat');
            if (holidayTitle) dayClasses.push('holiday');

            dayDiv.className = dayClasses.join(' ');
            dayDiv.innerHTML = `
                <div class="date-num">
                    <span>${date}</span>
                    ${holidayTitle ? `<span style="font-size:0.65rem; color:var(--holiday-color);">${holidayTitle}</span>` : ''}
                </div>
            `;

            const events = list.filter(c => c.consultDate && c.consultDate.startsWith(dateStr));

            events.forEach(ev => {
                const time = ev.consultDate.split('T')[1] || '';
                const card = document.createElement('div');
                card.className = `event-card status-${ev.consultStatus}`;
                card.innerHTML = `<strong>${time}</strong> ${ev.name}`;
                dayDiv.appendChild(card);
            });

            pcGrid.appendChild(dayDiv);

            if (events.length > 0 || holidayTitle) {
                hasEvents = true;
                const mGroup = document.createElement('div');
                mGroup.className = 'mobile-date-group';
                let evHtml = '';
                events.forEach(ev => {
                    const time = ev.consultDate.split('T')[1] || '';
                    const contactNum = ev.storePhone || ev.phone || '연락처 미등록';
                    evHtml += `
                        <div class="event-card status-${ev.consultStatus}" style="padding:10px; margin-top:6px;">
                            <div style="font-weight:bold; color:var(--primary-color);">${time} ${ev.name} [${ev.consultStatus}]</div>
                            <div style="font-size:0.78rem; color:#4a5568; margin-top:2px;">담당: ${ev.consultant || '출장팀'} | ☎ ${contactNum}</div>
                        </div>
                    `;
                });
                mGroup.innerHTML = `
                    <div class="mobile-date-header">
                        <span>${month + 1}월 ${date}일 (${['일','월','화','수','목','금','토'][dayOfWeek]})</span>
                        ${holidayTitle ? `<span style="font-size:0.75rem; color:var(--holiday-color); font-weight:bold;">${holidayTitle}</span>` : ''}
                    </div>
                    ${evHtml || '<div style="font-size:0.75rem; color:#a0aec0;">일정 없음</div>'}
                `;
                mList.appendChild(mGroup);
            }
        }

        if (!hasEvents) {
            mList.innerHTML = `<div style="padding:20px; text-align:center; color:#a0aec0; background:white; border-radius:8px; font-size:0.85rem;">이번 달 예정된 현장 일정이 없습니다.</div>`;
        }
    }

    function changeMonth(d) {
        currentDate.setMonth(currentDate.getMonth() + d);
        renderCalendar();
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function filterData() {
        const txt = document.getElementById('searchInput').value.toLowerCase();
        const stat = document.getElementById('statusFilter').value;
        const cards = document.querySelectorAll('.accordion-card');
        
        let list = companies.filter(c => c.projectId === currentProject);
        if (!isAdmin) list = list.filter(c => c.isVisible !== false);
        list.sort((a, b) => (a.isCompleted === b.isCompleted) ? 0 : a.isCompleted ? 1 : -1);

        list.forEach((c, i) => {
            const str = Object.values(c).join(' ').toLowerCase();
            const matchTxt = str.includes(txt);
            const matchStat = !stat || str.includes(stat);
            if (cards[i]) cards[i].style.display = (matchTxt && matchStat) ? '' : 'none';
        });
    }

    // 초기 화면 즉시 렌더링 후 비동기 시트 데이터 연동
    window.onload = function() {
        checkAdminAuth();
        renderProjectTabs();
        renderStats();
        renderCards();
        renderCalendar();
        loadDataFromSheet();
    };
</script>
</body>
</html>
